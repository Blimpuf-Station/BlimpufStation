name: Check PR Target Branch

# Cancel older jobs on PRs when new changes are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  check-target-branch:
    runs-on: ubuntu-latest

    steps:
      - name: Check if PR targets blimpuf-dev
        env:
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          echo "PR from: $SOURCE_BRANCH -> $TARGET_BRANCH"

          # Allow PRs between Blimpuf branches in either direction.
          if [[ ("$SOURCE_BRANCH" == "blimpuf-dev" || "$SOURCE_BRANCH" == "blimpuf-staging" || "$SOURCE_BRANCH" == "blimpuf-live") &&
                ("$TARGET_BRANCH" == "blimpuf-dev" || "$TARGET_BRANCH" == "blimpuf-staging" || "$TARGET_BRANCH" == "blimpuf-live") ]]; then
            echo "Allowed: PR between Blimpuf branches"
            exit 0
          fi

          # For all other PRs, require blimpuf-dev as target.
          if [ "$TARGET_BRANCH" != "blimpuf-dev" ]; then
            echo "Error: PR must target 'blimpuf-dev' branch, but targets '$TARGET_BRANCH'"
            echo "Please change the target branch to 'blimpuf-dev'"
            exit 1
          else
            echo "Success: PR correctly targets 'blimpuf-dev' branch"
          fi
