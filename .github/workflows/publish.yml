name: Publish

concurrency:
  group: publish
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      changelog_only:
        description: Send Discord changelog without building or uploading
        type: boolean
        default: false

jobs:
  build:
    name: Build & Package
    if: github.ref == 'refs/heads/blimpuf-live' && !inputs.changelog_only
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Install OS deps
        run: sudo apt-get install -y python3-paramiko python3-lxml

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fetch all tags (RobustToolbox)
        run: |
          cd RobustToolbox
          git fetch --all --tags

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: dotnet restore
        run: dotnet restore

      - name: Build Packaging
        run: dotnet build Content.Packaging -c Release --no-restore /m

      - name: Package server
        run: dotnet run --project Content.Packaging server --platform win-x64 --platform win-arm64 --platform linux-x64 --platform linux-arm64 --platform osx-x64 --platform osx-arm64

      - name: Package client
        run: dotnet run --project Content.Packaging client --no-wipe-release

      - name: Publish version
        run: Tools/publish_multi_request.py
        env:
          FORK_ID: blimpuf-live
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          GITHUB_REPOSITORY: ${{ vars.GITHUB_REPOSITORY }}

  update-changelog:
    name: Publish Changelogs
    if: >-
      !cancelled() && github.ref == 'refs/heads/blimpuf-live' &&
      (inputs.changelog_only || needs.build.result == 'success')
    needs: build
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install changelog dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-requests python3-yaml

      - name: Send Blimpuf live changelog
        run: /usr/bin/python3 Tools/actions_changelogs_since_last_run.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # The webhook must target live changelog channel 1500641641768423614.
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_CHANGELOG_ROLE_ID: "1548096887570178148"
          CHANGELOG_ONLY: ${{ inputs.changelog_only }}
