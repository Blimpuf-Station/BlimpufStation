- type: entity
  id: CartridgePistolRubber
  name: cartridge (.35 auto rubber)
  description: A medium-power pistol and submachine gun cartridge, widely-considered the standard in most parts of the sector. Less-lethal cartridge, designed for riot control with minimal casualties. Broken bones will result in pay deduction. #Blimpuf
  parent: [BaseContrabandTier2, BaseCartridgePistol] # Blimpuf Less-Lethal is Tier 2
  components:
  - type: CartridgeAmmo
    proto: RubberBulletTrace
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#43c4f7"

- type: entity
  id: CartridgePistol40SP
  name: cartridge (.40 SP)
  parent: BaseCartridgePistol
  description: A powerful pistol cartridge, preferred by those for whom .35 auto is not enough. Soft-point, standard kinetic projectile, the soft lead tip expands slightly on impact to increase damage, at a slight cost to armor penetration. #Blimpuf
  components:
  - type: CartridgeAmmo
    proto: BulletPistolTrace40SP
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#326ec8"
  - type: Tag
    tags:
      - Cartridge
      - CartridgePistolDP

- type: entity
  id: CartridgePistol40HP
  name: cartridge (.40 HP)
  parent: CartridgePistol40SP
  description: A powerful pistol cartridge, preferred by those for whom .35 auto is not enough. The cavity at it's tip allows the hollow-point projectile to expand on impact with a soft target for maximum damage. Ineffective against armoured opponents. #Blimpuf
  components:
  - type: CartridgeAmmo
    proto: BulletPistolTrace40HP
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#000000"

- type: entity
  id: CartridgePistol40FMJ
  name: cartridge (.40 FMJ)
  parent: CartridgePistol40SP
  description: A powerful pistol cartridge, preferred by those for whom .35 auto is not enough. Full metal jacket projectiles have a full copper casing. A good in-between soft-point and armor-piercing projectiles, for lightly armored threats. #Blimpuf
  components:
  - type: CartridgeAmmo
    proto: BulletPistolTrace40FMJ
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#B68F0E"

- type: entity
  id: CartridgePistol40AP
  name: cartridge (.40 AP)
  parent: CartridgePistol40SP
  description: A powerful pistol cartridge, preferred by those for whom .35 auto is not enough. Armor-piercing ammunition is renowned for its ability to cut straight through body armor. #Blimpuf
  components:
  - type: CartridgeAmmo
    proto: BulletPistolTrace40AP
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#1A8C1A"

- type: entity
  id: CartridgePistolImprovised
  name: improvised cartridge (.35 auto)
  description: A handmade pistol bullet, uses phosphorus as a propellent instead of gunpowder which makes it much less effective.
  parent: [BaseCartridgePistol, BaseMinorContraband]
  components:
  - type: CartridgeAmmo
    proto: BulletPistolTraceImprovised
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Ammunition/Casings/improvised_casing.rsi
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#717171"
  - type: Tag
    tags:
      - Cartridge
      - CartridgePistolImprovised
  - type: Construction
    graph: ImprovisedPistolBulletGraph
    node: shell

