- type: entity
  id: CartridgePistolRubber
  name: cartridge (.35 auto rubber)
  description: Medium-power rimless cartridge, widely-considered the standard in most parts of the galaxy, used by pistols and small automatic firearms. Less-lethal cartridge, designed for riot control with minimal casualties. Broken bones will result in pay deduction. #Blimpuf
  parent: [BaseContrabandTier2, BaseCartridgePistol] # Blimpuf Less-Lethal is Tier 2
  components:
  - type: CartridgeAmmo
    proto: RubberBulletTrace
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#43c4f7"

- type: entity
  id: CartridgePistol40SP
  name: cartridge (.40 SP)
  parent: BaseCartridgePistol
  description: Rimless pistol cartridge, stronger caliber and much less popular than the .35, used by pistols. Soft-point, standard kinetic cartridge, mostly used by law enforcements in engaging low-level threats. #Blimpuf
  components:
  - type: CartridgeAmmo
    proto: BulletPistolTrace40SP
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#326ec8"
  - type: Tag
    tags:
      - Cartridge
      - CartridgePistolDP

- type: entity
  id: CartridgePistol40HP
  name: cartridge (.40 HP)
  parent: CartridgePistol40SP
  description: Rimless pistol cartridge, much less popular than the .35, used by pistols. Hollow-point expands on impact with a soft target. #Blimpuf
