- type: entity
  id: CartridgePistol40AP
  name: cartridge (.40 AP)
  parent: CartridgePistol40SP
  description: Rimless pistol cartridge, widely-considered the standard in most parts of the galaxy, most often used by pistols and small automatic firearms. Praised across the galaxy, Armor-Piercing is renown for its ability to easily penetrate armor. #Blimpuf
