- type: entity
  id: CartridgePistolRubber
  name: cartridge (.35 auto rubber)
  parent: BaseCartridgePistol
  description: Medium-power rimless cartridge, less popular than the .40 but still commonly used by pistols and small automatic firearms. Less-lethal cartridge, designed for riot control with minimal casualties. Broken bones will result in a deduction of pay. #Blimpuf
  components:
  - type: CartridgeAmmo
    proto: RubberBulletTrace
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#43c4f7"

- type: entity
  id: CartridgePistol40SP
  name: cartridge (.40 SP)
  parent: BaseCartridgePistol
  description: Rimless pistol cartridge, widely-considered the standard in most parts of the galaxy, most often used by pistols and small automatic firearms. Standard kinetic cartridge, mostly used by law enforcements in engaging low-level threats. #Blimpuf
  components:
  - type: CartridgeAmmo
    proto: BulletPistolTrace40SP
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#326ec8"
  - type: Tag
    tags:
      - Cartridge
      - CartridgePistolDP

- type: entity
