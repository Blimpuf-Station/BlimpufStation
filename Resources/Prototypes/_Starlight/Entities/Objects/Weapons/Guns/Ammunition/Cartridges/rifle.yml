  - type: CartridgeAmmo
    proto: BulletRifleTraceHP
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#000000"

- type: entity
  id: CartridgeRifleFMJ
  name: cartridge (.20 rifle FMJ)
  parent: BaseCartridgeRifle
  description: Rimless centerfire intermediate power cartridge, the most common after the .35, often used in semi-automatic and automatic rifles. Full metal jacket come with a copper casing, allowing higher muzzle velocity. A good in-between hollow-points and armor-piercing cartridges, for softer armor. #Blimpuf
  components:
  - type: CartridgeAmmo
    proto: BulletRifleTraceFMJ
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#B68F0E"

- type: entity
  id: CartridgeRifleAP
  name: cartridge (.20 rifle AP)
  parent: BaseCartridgeRifle
  description: Rimless centerfire intermediate power cartridge, the most common after the .35, often used in semi-automatic and automatic rifles. Praised across the galaxy, with a tungsten tip, armor-piercing is renown for its ability to easily penetrate armor. #Blimpuf
