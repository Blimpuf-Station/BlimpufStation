- type: entity
  id: CartridgeRifleRubber
  name: cartridge (.20 rifle rubber)
  description: Rimless centerfire intermediate power cartridge, the most common after the .35, often used in semi-automatic and automatic rifles. Less-lethal cartridge, designed for riot control with minimal casualties. Broken bones will result in pay deduction.. #Blimpuf
  parent: [BaseContrabandTier2, BaseCartridgeRifle] # Blimpuf Less-Lethal is Tier 2
  components:
  - type: CartridgeAmmo
    proto: RubberBulletTrace
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#43c4f7"

- type: entity
  id: CartridgeRifleHP
  name: cartridge (.20 rifle HP)
  parent: BaseCartridgeRifle
  description: Rimless centerfire intermediate power cartridge, the most common after the .35, often used in semi-automatic and automatic rifles. The lack of tip allows the hollow-point cartridge to expand on impact with a soft target. #Blimpuf
