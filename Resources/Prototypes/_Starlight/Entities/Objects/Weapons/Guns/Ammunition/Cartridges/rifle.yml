- type: entity
  id: CartridgeRifleRubber
  name: cartridge (.20 rifle rubber)
  parent: BaseCartridgeRifle
  description: A modern intermediate centerfire cartridge, the most common cartridge after the .40, often used by rifles. Less-lethal cartridge, designed for riot control with minimal casualties. Broken bones will result in a deduction of pay. #Blimpuf
  components:
  - type: CartridgeAmmo
    proto: RubberBulletTrace
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#43c4f7"

