- type: entity
  id: CartridgeLightRifleRubber
  name: cartridge (.30 rifle rubber)
  description: A powerful intermediate rifle cartridge used by many combat rifles and LMGs. Less-lethal projectile, designed for riot control with minimal casualties. Broken bones will result in pay deduction. #Blimpuf
  parent: [BaseContrabandTier2, BaseCartridgeLightRifleSP] # Blimpuf Less-Lethal is Tier 2
  components:
  - type: CartridgeAmmo
    proto: RubberBulletTrace
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#43c4f7"

- type: entity
  id: CartridgeLightRifleImprovised
  name: improvised cartridge (.30 rifle)
  description: A handmade rifle bullet, uses phosphorus as a propellent instead of gunpowder which makes it much less effective.
  parent: [BaseCartridgeLightRifleSP, BaseMinorContraband]
  components:
  - type: CartridgeAmmo
    proto: BulletLightRifleTraceImprovised
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Ammunition/Casings/improvised_casing.rsi
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#717171"
  - type: Tag
    tags:
      - Cartridge
      - CartridgeLightRifleImprovised
  - type: Construction
    graph: ImprovisedLightRifleBulletGraph
    node: shell

- type: entity
  id: CartridgeLightRifleHP
  name: cartridge (.30 rifle HP)
  parent: BaseCartridgeLightRifleSP
  description: A powerful intermediate rifle cartridge used by many combat rifles and LMGs. The cavity at it's tip allows the hollow-point projectile to expand on impact with a soft target for maximum damage. Ineffective against armoured opponents. #Blimpuf
  components:
  - type: CartridgeAmmo
    proto: BulletLightRifleTraceHP
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#000000"

- type: entity
  id: CartridgeLightRifleFMJ
  name: cartridge (.30 rifle FMJ)
  parent: BaseCartridgeLightRifleSP
  description: A powerful intermediate rifle cartridge used by many combat rifles and LMGs. Full metal jacket projectiles have a full copper casing. A good in-between soft-point and armor-piercing projectiles, for lightly armored threats. #Blimpuf
  components:
  - type: CartridgeAmmo
    proto: BulletLightRifleTraceFMJ
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#B68F0E"

- type: entity
  id: CartridgeLightRifleAP
  name: cartridge (.30 rifle AP)
  parent: BaseCartridgeLightRifleSP
  description: A powerful intermediate rifle cartridge used by many combat rifles and LMGs. Armor-piercing ammunition is renowned for its ability to cut straight through body armor. #Blimpuf
  components:
  - type: CartridgeAmmo
    proto: BulletLightRifleTraceAP
  - type: Sprite
