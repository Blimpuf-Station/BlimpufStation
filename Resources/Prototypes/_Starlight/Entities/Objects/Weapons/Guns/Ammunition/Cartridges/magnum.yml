- type: entity
  id: CartridgeMagnumRubber
  name: cartridge (.45 magnum rubber)
  description: Heavy magnum cartridge mostly used by revolvers. Less-lethal projectile, designed for riot control with minimal casualties. Broken bones will result in pay deduction. #Blimpuf
  parent: [BaseContrabandTier2, BaseCartridgeMagnum] # Blimpuf Less-Lethal is Tier 2
  components:
  - type: CartridgeAmmo
    proto: RubberBulletTrace
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#43c4f7"

- type: entity
  id: CartridgeMagnumImprovised
  name: improvised cartridge (.45 magnum)
  description: A handmade revolver bullet, stuffed to the brim with phosphorus for extra 'oomph'. Still not as good as a normal magnum bullet.
  parent: [BaseCartridgePistol, BaseMinorContraband]
  components:
  - type: CartridgeAmmo
    proto: BulletMagnumTraceImprovised
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Ammunition/Casings/improvised_casing.rsi
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#717171"
  - type: Tag
    tags:
      - Cartridge
      - CartridgeMagnumImprovised
  - type: Construction
    graph: ImprovisedMagnumBulletGraph
    node: shell

- type: entity
  id: CartridgeMagnumHP
  name: cartridge (.45 magnum HP)
  parent: BaseCartridgeMagnum
  description: Heavy magnum cartridge mostly used by revolvers. The cavity at it's tip allows the hollow-point projectile to expand on impact with a soft target for maximum damage. Ineffective against armoured opponents. #Blimpuf
  components:
  - type: CartridgeAmmo
    proto: BulletMagnumTraceHP
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#000000"

- type: entity
  id: CartridgeMagnumFMJ
  name: cartridge (.45 magnum FMJ)
  parent: BaseCartridgeMagnum
  description: Heavy magnum cartridge mostly used by revolvers. Full Metal Jacket come with a copper casing allowing higher muzzle velocity. Full metal jacket projectiles have a full copper casing. A good in-between soft-point and armor-piercing projectiles, for lightly armored threats. #Blimpuf
  components:
  - type: CartridgeAmmo
    proto: BulletMagnumTraceFMJ
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#B68F0E"
