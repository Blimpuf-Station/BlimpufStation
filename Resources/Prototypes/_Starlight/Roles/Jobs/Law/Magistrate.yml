- type: job
  id: Magistrate
  name: job-name-magistrate
  description: job-description-magistrate
  playTimeTracker: JobMagistrate
  requirements:
  - !type:DepartmentTimeRequirement
    department: Command
    time: 10h
  - !type:DepartmentTimeRequirement
    department: Representatives
    time: 10h
  - !type:DepartmentTimeRequirement
    department: Security
    time: 10h
  - !type:RolesRequirement
    proto: MagiReq
  - !type:TraitsRequirement
    traits:
      - Iterator
    inverted: true
  startingGear: MagistrateGear
  icon: "JobIconMagistrate"
  rules: job-rules-corporate-aligned
  supervisors: job-supervisors-centcom
  displayWeight: 45
  setPreference: true
  access:
  - Magistrate
  - IAA
#  - Lawyer # Lawyer is now for Lawyers, not IAAs/Magis.
  - Brig
  - Security
  - Command
  - Maintenance
  - GenpopEnter
  - GenpopLeave
  - Debrief
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant ]
  - !type:AddComponentSpecial
    components:
      - type: CommandStaff

- type: startingGear
  id: MagistrateGear
  equipment:
    #jumpsuit: MagistrateUniformSuit
    #shoes: ClothingShoesBootsLaceup
    #eyes: ClothingEyesGlassesSecurity
    #gloves: ClothingHandsGlovesColorWhite
    #outerClothing: ClothingOuterRobesJudge
    id: MagistratePDA
    ears: ClothingHeadsetAltCCRep
    #head: ClothingHeadHatPwig
    belt: BoxFolderCentComClipboard
  storage:
    back:
    - RubberStampMagistrate
    - ClothingNeckLawyerbadge
    - GavelHammer
    - GavelBlock
    - Flash
    #- MagistrateUniformSkirt

- type: chameleonOutfit
  id: MagistrateChameleonOutfit
  job: Magistrate
  equipment:
    head: ClothingHeadHatPwig
    eyes: ClothingEyesGlassesSecurity
    outerClothing: ClothingOuterRobesMagistrate
    misc: ClothingNeckLawyerbadge # Starlight change slot to misc.
    gloves: ClothingHandsGlovesColorWhite
