            AtmosphericTechnician: [ 3, 3 ]
            StationEngineer: [ 4, 5 ]
            TechnicalAssistant: [ 2, 3 ]
            #Medical
            Chemist: [ 2, 2 ]
            MedicalDoctor: [ 5, 5 ]
            Paramedic: [ 1, 1 ]
            MedicalIntern: [ 2, 3 ]
            Psychologist: [ 1, 1 ]
            Surgeon: [ 1, 1 ]
            #Science
            Scientist: [ 4, 4 ]
            Roboticist: [ 1, 2 ]
