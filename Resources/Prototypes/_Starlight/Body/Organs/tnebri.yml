- type: entity
  id: BaseTNebriOrgan
  parent: BaseItem
  abstract: true
  components:
  - type: Sprite
    sprite: _Starlight/Mobs/Species/Cyclorite/organs.rsi
  - type: Organ
  - type: Edible
  - type: Extractable
    grindableSolutionName: organ
  - type: SolutionContainerManager
    solutions:
      organ:
        reagents:
        - ReagentId: Nutriment
          Quantity: 10
      food:
        maxVol: 5
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 5
  - type: FlavorProfile
    flavors:
      - people
  - type: Tag
    tags:
      - Meat

- type: entity
  id: OrganTNebriBrain
  parent: [BaseOrganBrain, BaseTNebriOrgan]
  name: T'Nebri brain
  suffix: T'Nebri
  description: "The source of incredible, unending intelligence. Honk."
  components:
  - type: Sprite
    state: brain

- type: entity
  id: OrganTNebriEye
  parent: [BaseTNebriOrgan, BaseOrganEyes]
  name: T'Nebri eye
  suffix: T'Nebri
  description: "T'Nebri see the world slightly differently."
  components:
  - type: Sprite
    layers:
      - state: eyeball
  - type: FunctionalOrgan
    comps:
    # - type: TNebriVision
    - type: NightVision
      disabilityBlockable: true
  - type: OrganVisualization
    layer: Eyes
    prototypes:
      Default: MobTNebriEyes

- type: entity
  id: OrganTNebriTongue
  parent: [BaseTNebriOrgan, BaseOrganTongue]
  name: T'Nebri tongue
  suffix: T'Nebri
  description: "A fleshy muscle mostly used for lying."
  components:
  - type: Sprite
    state: tongue

- type: entity
  id: OrganTNebriEars
  parent: [BaseTNebriOrgan, BaseOrganEars]
  name: T'Nebri ears
  suffix: T'Nebri
  description: "There are three parts to the ear: inner, middle and outer. Only one of these parts should normally be visible."
  components:
  - type: Sprite
    state: ears

- type: entity
  id: OrganTNebriLungs
  parent: [BaseTNebriOrgan, BaseOrganLungs]
  name: T'Nebri lungs
  suffix: T'Nebri
  description: "T'Nebri lungs filter nitrogen from the atmosphere to breathe."
  components:
  - type: Sprite
    layers:
      - state: lung-l
      - state: lung-r
  - type: Lung
    alert: LowNitrogen
  - type: Metabolizer
    removeEmpty: true
    solutionOnBody: false
    solution: "Lung"
    metabolizerTypes: [ Slime, TNebri ]
    groups:
    - id: Gas
      rateModifier: 100.0
  - type: SolutionContainerManager
    solutions:
      organ:
        reagents:
        - ReagentId: Nutriment
          Quantity: 10
      Lung:
        maxVol: 100.0
        canReact: false
      food:
        maxVol: 5
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 5

- type: entity
  id: OrganTNebriHeart
  parent: [BaseTNebriOrgan, BaseOrganHeart]
  name: T'Nebri heart
  suffix: T'Nebri
  description: "I feel bad for the heartless bastard who lost this."
  components:
  - type: Sprite
    state: heart-on
  # The heart 'metabolizes' medicines and poisons that aren't filtered out by other organs.
  # This is done because these chemicals need to have some effect even if they aren't being filtered out of your body.
  # You're technically 'immune to poison' without a heart, but.. uhh, you'll have bigger problems on your hands.
  - type: Metabolizer
    maxReagents: 2
    metabolizerTypes: [ TNebri ]
    groups:
    - id: Medicine
    - id: Poison
    - id: Narcotic

- type: entity
  id: OrganTNebriStomach
  parent: [BaseTNebriOrgan, BaseOrganStomach]
  name: T'Nebri stomach
  suffix: T'Nebri
  description: "Gross. This is hard to stomach."
  components:
  - type: Sprite
    state: stomach
  - type: SolutionContainerManager
    solutions:
      stomach:
        maxVol: 60
      food:
        maxVol: 5
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 5
  - type: Stomach
  # The stomach metabolizes stuff like foods and drinks.
  # TODO: Have it work off of the ent's solution container, and move this
  # to intestines instead.
  - type: Metabolizer
    # mm yummy
    maxReagents: 3
    metabolizerTypes: [ Slime ]
    groups:
    - id: Food
    - id: Drink

- type: entity
  id: OrganTNebriLiver
  parent: [BaseTNebriOrgan, BaseOrganLiver]
  name: T'Nebri liver
  suffix: T'Nebri
  description: "Pairing suggestion: chianti and fava beans."
  components:
  - type: Sprite
    state: liver
  - type: Metabolizer # The liver metabolizes certain chemicals only, like alcohol.
    maxReagents: 1
    metabolizerTypes: [ Slime ]
    groups:
    - id: Alcohol

- type: entity
  id: OrganTNebriKidneys
  parent: [BaseTNebriOrgan, BaseOrganKidneys]
  name: T'Nebri kidneys
  suffix: T'Nebri
  description: "Filters toxins from the bloodstream."
  components:
  - type: Sprite
    layers:
      - state: kidney-l
      - state: kidney-r
  # The kidneys just remove anything that doesn't currently have any metabolisms, as a stopgap.
  - type: Metabolizer
    maxReagents: 5
    metabolizerTypes: [ Slime ]
    removeEmpty: true
