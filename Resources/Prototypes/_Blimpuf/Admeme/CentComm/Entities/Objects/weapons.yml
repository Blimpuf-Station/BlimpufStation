- type: entity
  name: CentComm mini syringe
  parent: [ Syringe, BaseCentcommContraband ]
  description: A regular syringe, reshaped to fit inside of a gun.
  id: MiniSyringeCC
  components:
  - type: AccessReader
    access: [["CentralCommand"]]
  - type: Lock
    mindShieldLock: true
    unlockOnClick: false
    useAccess: true
    autoUnlock: true
    autoLock: true
    showLockVerbs: true
    breakOnAccessBreaker: false
  - type: Sprite
    sprite: Objects/Specific/Chemistry/syringe.rsi
    layers:
      - state: minisyringe1
        map: ["enum.SolutionContainerLayers.Fill"]
        visible: false
      - state: ccsyringeproj
  - type: SolutionContainerManager
    solutions:
      injector:
        maxVol: 5
  - type: SolutionContainerVisuals
    maxFillLevels: 3
    fillBaseName: minisyringe
    inHandsMaxFillLevels: 3
    inHandsFillBaseName: -fill-
  - type: EmbeddableProjectile
    offset: "0,-0.1"
    minimumSpeed: 3
    removalTime: 0.25
    embedOnThrow: false
  - type: SolutionInjectWhileEmbedded
    transferAmount: 1
    solution: injector
    updateInterval: 2
  - type: SolutionInjectOnEmbed
    transferAmount: 1
    solution: injector
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.2
        density: 5
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.1,-0.3,0.1,0.3"
        hard: false
        mask:
        - Impassable
        - BulletImpassable
  - type: Projectile
    deleteOnCollide: false
    onlyCollideWhenShot: true
    damage:
      types:
        Piercing: 5
  - type: Tag
    tags:
    - Syringe
    - Trash
    - SyringeGunAmmo

- type: entity
  name: experimental syringe gun
  parent: [ BaseStorageItem, BaseCentcommContraband ]
  id: LauncherSyringeCC
  description: Experimental syringe gun, designed for rapid distance injection.
  components:
  - type: AccessReader
    access: [["CentralCommand"]]
  - type: Lock
    mindShieldLock: true
    unlockOnClick: false
    useAccess: true
    autoUnlock: true
    autoLock: true
    showLockVerbs: true
    breakOnAccessBreaker: false
  - type: Sprite
    sprite: _Blimpuf/Objects/Weapons/Guns/Cannons/syringe_gun.rsi
    layers:
    - state: syringe_gun
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,3,1
    whitelist:
      tags:
      - SyringeGunAmmo
  - type: Gun
    fireRate: 3
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    - FullAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/syringe_gun.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/empty.ogg
    clumsyProof: true
  - type: ContainerAmmoProvider
    container: storagebase
  - type: Item
    size: Large
    shape:
    - 0,0,2,1
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
