- type: entity
  parent: BaseGameRule
  id: DynamicScaling20Pop
  components:
  - type: GameRule
    minPlayers: 5 # under this, theres to few people for antag
  - type: DynamicRule
    startingBudgetMin: 1 # per player, at 20 pop it will be 200
    startingBudgetMax: 2 # per player, at 20 pop it will be 400
    usePlayerScaling: true
    usePercentageBudgetStart: true
    budgetScalingPerPlayer: 10
    budgetPerSecond: 0.000375 # balanced around 20 people, at 10x per that's .075
    variantBudgetThreshold: 300
    variantBudgetPerSecond: 0.0001875 # same as above but half
    maxRuleInterval: 1800
    minRuleInterval: 1200 # 20-30 mins as opposed to alpha's 15-25.
    table: !type:AllSelector
      children:
      # Event Schedulers, Beta.
      - !type:GroupSelector
        conditions:
        - !type:RoundDurationCondition
          max: 5 # 5 seconds, really just here to ensure it rolls roundstart and then doesn't roll again
        children:
        - id: BaseDynamicEventScheduler
          weight: 94
          conditions:
          - !type:HasBudgetCondition
          - !type:MaxRuleOccurenceCondition
          - !type:MutuallyExclusiveRuleCondition #only choose one
            rules:
            - DynamicSurvivalEventScheduler
            - DynamicKesslerSyndromeEventScheduler
            - DynamicShitStationEventScheduler
        - id: DynamicSurvivalEventScheduler
          weight: 3
          conditions:
          - !type:HasBudgetCondition
          - !type:MaxRuleOccurenceCondition
          - !type:PlayerCountCondition
            min: 15
          - !type:MutuallyExclusiveRuleCondition
            rules:
            - BaseDynamicEventScheduler
            - DynamicKesslerSyndromeEventScheduler
            - DynamicShitStationEventScheduler
        - id: DynamicKesslerSyndromeEventScheduler
          weight: 1
          conditions:
          - !type:HasBudgetCondition
          - !type:MaxRuleOccurenceCondition
          - !type:PlayerCountCondition
            min: 15
          - !type:MutuallyExclusiveRuleCondition
            rules:
            - DynamicSurvivalEventScheduler
            - BaseDynamicEventScheduler
            - DynamicShitStationEventScheduler
        - id: DynamicShitStationEventScheduler
          weight: 2
          conditions:
          - !type:HasBudgetCondition
          - !type:MaxRuleOccurenceCondition
          - !type:MutuallyExclusiveRuleCondition
            rules:
            - DynamicSurvivalEventScheduler
            - DynamicKesslerSyndromeEventScheduler
            - BaseDynamicEventScheduler
      # Roundstart Only
      - !type:GroupSelector
        conditions:
        - !type:RoundDurationCondition
          max: 5 # 5 seconds, really just here to ensure it rolls roundstart and then doesn't roll again
        children:
        - id: TraitorScaling
          weight: 50
          conditions:
          - !type:HasBudgetCondition
          - !type:MaxRuleOccurenceCondition # the max number of this specific antag
            max: 10 #this doesn't really matter but it might help if things go wrong
          #- !type:PlayerCountCondition
          #  min: 5
        - id: ThiefScaling
          weight: 30 # less interesting than tot
          conditions:
          - !type:HasBudgetCondition
          - !type:MaxRuleOccurenceCondition
            max: 10
        - id: VampireScaling
          weight: 25 # more impactful than traitor
          conditions:
          - !type:HasBudgetCondition
          - !type:MaxRuleOccurenceCondition
            max: 10
        - id: NukeopsScaling
          weight: 30 # this might seem high but it can only be selected while there's enough budget while other rules can roll later
          conditions:
          - !type:HasBudgetCondition
          - !type:MaxRuleOccurenceCondition # only want one of this
          - !type:PlayerCountCondition
            min: 20
        - id: NukeopsScalingExtraOp
          weight: 100 # if it's nukies we want more ops to be super common
          conditions:
          - !type:HasBudgetCondition
          - !type:MaxRuleOccurenceCondition
            max: 10
          - !type:RequiresOtherRuleCondition
            rules:
            - NukeopsScaling #only possible if nukies is already selected
        - id: RevolutionaryScaling
          weight: 30
          conditions:
          - !type:HasBudgetCondition
          - !type:MaxRuleOccurenceCondition
          - !type:PlayerCountCondition
            min: 15
        - id: RevolutionaryScalingExtraHeadRev
          weight: 100
          conditions:
          - !type:HasBudgetCondition
          - !type:MaxRuleOccurenceCondition
            max: 10
          - !type:RequiresOtherRuleCondition
            rules:
            - RevolutionaryScaling
        - id: CosmicCultScaling
          weight: 30
          conditions:
          - !type:HasBudgetCondition
          - !type:MaxRuleOccurenceCondition
          - !type:PlayerCountCondition
            min: 20
        - id: CosmicCultScalingExtraCultist
          weight: 100
          conditions:
          - !type:HasBudgetCondition
          - !type:MaxRuleOccurenceCondition
            max: 10
          - !type:RequiresOtherRuleCondition
            rules:
            - CosmicCultScaling
        - id: ZombieScaling
          weight: 20 # lower cost
          conditions:
          - !type:HasBudgetCondition
          - !type:MaxRuleOccurenceCondition
          - !type:PlayerCountCondition
            min: 20
        - id: ZombieScalingExtraInitial
          weight: 80 # want other antags + zeds more than other gamerules
          conditions:
          - !type:HasBudgetCondition
          - !type:MaxRuleOccurenceCondition
            max: 10
          - !type:RequiresOtherRuleCondition
            rules:
            - ZombieScaling
      # Midround only
      - !type:GroupSelector
        conditions:
        - !type:RoundDurationCondition
          min: 300 # minimum 5 minutes
        children:
        - id: SleeperAgents
          weight: 15
          conditions:
          - !type:HasBudgetCondition
          - !type:RoundDurationCondition
            min: 1500 # 25 minutes
        - id: DragonSpawn
          weight: 15
          conditions:
          - !type:HasBudgetCondition
          - !type:RoundDurationCondition
            min: 1800 # 30 minutes
        - id: NinjaSpawn
          weight: 15
          conditions:
          - !type:HasBudgetCondition
          - !type:RoundDurationCondition
            min: 1800 # 30 minutes
        - id: SamuraiSpawn
          weight: 15
          conditions:
            - !type:HasBudgetCondition
            - !type:RoundDurationCondition
              min: 1800 # 30 minutes
        - id: ParadoxCloneSpawn
          weight: 20
          conditions:
          - !type:HasBudgetCondition
          - !type:MaxRuleOccurenceCondition
            max: 2 # We don't want this showing up too often as it's got high weight and isn't that interesting, so only 2.
          - !type:RoundDurationCondition
            min: 1200 # 20 minutes
        - id: ParadoxCrisisSpawn
          weight: 10
          conditions:
          - !type:HasBudgetCondition
          - !type:MaxRuleOccurenceCondition
            max: 2
          - !type:RoundDurationCondition
            min: 1800 # 30 minutes
        - id: LoneOpsSpawn
          weight: 5
          conditions:
          - !type:HasBudgetCondition
          - !type:PlayerCountCondition
            min: 20
          - !type:RoundDurationCondition
            min: 3000 # 50 minutes
        - id: WizardSpawn
          weight: 1
          conditions:
          - !type:HasBudgetCondition
          - !type:MutuallyExclusiveRuleCondition
            rules:
            - Zombie # Wizards don't lose their abilities in Zombie games, so they can't be allowed together
          - !type:PlayerCountCondition
            min: 25
          - !type:RoundDurationCondition
            min: 1800 # 30 minutes
        - id: AbductorsSpawn
          weight: 15
          conditions:
          - !type:HasBudgetCondition
          - !type:PlayerCountCondition
            min: 10
          - !type:RoundDurationCondition
            min: 1200 # 20 minutes
        - id: EeepEvent
          weight: 1
          conditions:
          - !type:HasBudgetCondition
          - !type:PlayerCountCondition
            min: 25
          - !type:RoundDurationCondition
            min: 1200 # 20 minutes
        - id: ColossusSpawn
          weight: 4.5
          conditions:
          - !type:HasBudgetCondition
          - !type:PlayerCountCondition
            min: 25
          - !type:RoundDurationCondition
            min: 1500 # 25 minutes

