# Research
- type: entity
  parent: BaseTraitorObjective
  id: ResearchObjective
  description: We need you to research some of Nanotrasens high tech equipment. This will likely be found on members of Command or higher ups in Security.
  components:
  - type: Objective
    icon:
      sprite: Objects/Misc/module.rsi
      state: cargodisk
    difficulty: 1
  - type: ResearchTotalCondition
  - type: NumberObjective
    min: 1
    max: 3
    title: objective-condition-research-title
    description: objective-condition-research-description

# Research Specific
- type: entity
  abstract: true
  parent: BaseTraitorObjective
  id: BaseTraitorResearchSpecificObjective
  components:
  - type: ResearchSpecificCondition
    objectiveText: objective-condition-research-specific-title
    objectiveNoOwnerText: objective-condition-research-specific-title-no-owner
    descriptionText: objective-condition-research-specific-description
  - type: Objective
    difficulty: 1.5
  - type: ObjectiveLimit
    limit: 1 # Everyone should focus on one item individually

