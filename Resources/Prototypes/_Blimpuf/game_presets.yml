- type: gamePreset
  id: DynamicScaling20
  alias:
  - dynamicscaling20
  - multiantag20scaling
  - directorscaling20
  name: dynamic-title
  showInVote: false
  description: dynamic-description
  minPlayers: 5
  voteCooldown: 0
  rules:
  - DynamicScaling20Pop
  - SpaceTrafficControlEventScheduler
  - BasicRoundstartVariation

- type: gamePreset
  id: DynamicScalingDebug
  alias:
  - dynamicscalingdebug
  - multiantagdebugscaling
  - directorscalingdebug
  name: dynamic-title
  showInVote: false # admin-only for now until we fix some bugs
  description: dynamic-description
  minPlayers: 0
  voteCooldown: 0 # This one actually can roll back to back.
  rules:
  - DynamicScalingDEBUG
  - SpaceTrafficControlEventScheduler # No event/meteor schedulers, since we handle that in dynamic too.
  - BasicRoundstartVariation
