- type: entity
  name: taipan laser bolt
  id: BulletLaserTaipan
  parent: BaseBulletTrigger
  categories: [ HideSpawnMenu ]
  components:
    - type: Sprite
      sprite: Objects/Weapons/Guns/Projectiles/projectiles_magnum.rsi
      layers:
        - state: magnum
          shader: unshaded
    - type: PointLight
      enabled: true
      color: "#ff4300"
    - type: Projectile
      impactEffect: BulletImpactEffectOrangeDisabler
      damage:
        types:
          Heat: 20
    - type: ExplodeOnTrigger
    - type: Explosive
      explosionType: Default
      maxIntensity: 5
      intensitySlope: 5
      totalIntensity: 45
      maxTileBreak: 5

- type: entity
  name: incinerator igniting bolt
  id: BulletEnergyIncineratorLaser
  parent: BulletEnergyTurretBase
  categories: [ HideSpawnMenu ]
  components:
    - type: Ammo
      muzzleFlash: MuzzleFlashEffectHeavyLaser
    - type: Sprite
      sprite: Objects/Weapons/Guns/Projectiles/projectiles_tg.rsi
      layers:
        - state: heavylaser
          shader: unshaded
    - type: Projectile
      impactEffect: BulletImpactEffectOrangeDisabler
      damage:
        types:
          Heat: 2
    - type: IgniteOnCollide
      fireStacks: 0.75

- type: entity
  name: incinerator electrocuting bolt
  id: BulletEnergyIncineratorDisabler
  parent: BulletEnergyTurretBase
  categories: [ HideSpawnMenu ]
  components:
    - type: Ammo
      muzzleFlash: MuzzleFlashEffectOmnilaser
    - type: Sprite
      sprite: Objects/Weapons/Guns/Projectiles/projectiles_tg.rsi
      layers:
        - state: omnilaser
          shader: unshaded
    - type: Projectile
      impactEffect: BulletImpactEffectDisabler
      damage:
        types:
          Shock: 1
    - type: StaminaDamageOnCollide
      damage: 4
    - type: CyberneticDisruptionOnCollide
      disableChance: 0.02

- type: entity
  name: energy buckshot single
  id: BulletSyndieEnergyShotgunBuckshot
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
    - type: Reflective
      reflective:
        - Energy
    - type: FlyBySound
      sound:
        collection: EnergyMiss
        params:
          volume: 5
    - type: Sprite
      sprite: Objects/Weapons/Guns/Projectiles/projectiles_tg.rsi
      layers:
        - state: heavylaser
          shader: unshaded
    - type: Physics
    - type: Fixtures
      fixtures:
        projectile:
          shape:
            !type:PhysShapeAabb
            bounds: "-0.15,-0.3,0.15,0.3"
          hard: false
          mask:
            - Opaque
            - Impassable
            - BulletImpassable
        fly-by: &flybyfixture
          shape: !type:PhysShapeCircle
            radius: 1.5
    - type: Ammo
    - type: Projectile
      impactEffect: BulletImpactEffectOrangeDisabler
      damage:
        types:
          Heat: 5
          Structural: 5

