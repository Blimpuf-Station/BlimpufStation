- type: entity
  parent: ClothingNeckChameleon
  id: ClothingNeckChameleonPhaseCloak
  suffix: Chameleon, Phase Cloak
  components:
  - type: ItemToggle
    onUse: false # can't activate with hand keybind
    onActivate: false # can't activate in world
  - type: Item
    size: Normal
  - type: ToggleClothing
    action: ActionTogglePhaseCloak
    disableOnUnequip: true
  - type: ComponentToggler
    parent: true
    components:
    - type: Stealth
      minVisibility: -0.99
      maxVisibility: 0.15
      lastVisibility: 0.15
  - type: PowerCellDraw
    drawRate: 14 # roughly 50 seconds on the default cell
  - type: ToggleCellDraw
  - type: PowerCellSlot
    cellSlotId: cell_slot
    fitsInCharger: false
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot
      storagebase: !type:Container
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMedium
        whitelist:
          tags:
          - PowerCell
        blacklist:
          tags:
          - MechReactor
