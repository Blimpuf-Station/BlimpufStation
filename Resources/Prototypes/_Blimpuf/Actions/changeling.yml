- type: entity
  id: ActionCyberneticCamouflage
  name: Cybernetic Camoflage
  description: Instantly become undetectable by Silicon based beings. Costs 15 chemicals.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 1
    itemIconStyle: NoItem
    icon:
      sprite: Changeling/changeling_abilities.rsi
      state: cybernetic_camouflage
    checkCanInteract: false
    checkConsciousness: false
  - type: InstantAction
    event: !type:ActionCyberneticCamouflageEvent {}
  - type: ChangelingAction
    chemicalCost: 15 # Takes energy to disable, so we can make it a little cheaper.

- type: entity
  id: ActionContortBody
  name: Contort Body
  description: Contort your form into a completely inhumane position, allowing you to fit into vents. Costs 15 Chemicals.
  categories: [ HideSpawnMenu ]
  components:
    - type: Action
      useDelay: 1
      itemIconStyle: NoItem
      icon:
        sprite: Changeling/changeling_abilities.rsi
        state: contort_body
      checkCanInteract: false
      checkConsciousness: false
    - type: InstantAction
      event: !type:ActionContortBodyEvent {}
    - type: ChangelingAction
      chemicalCost: 15

- type: entity
  parent: BaseAction
  id: ActionRetractableItemTentacle
  name: Tentacle
  description: Shed your flesh and reform it into a fleshy tentacle. Costs 20 chemicals to summon, and 20 chemicals to retract. # Starlight
  components:
    - type: Action
      useDelay: 2
      raiseOnAction: true
      itemIconStyle: BigAction
      icon:
        sprite: Changeling/changeling_abilities.rsi
        state: tentacle
    - type: InstantAction
      event: !type:OnRetractableItemActionEvent
    - type: RetractableItemAction
      spawnedPrototype: WeaponChangelingTentacle
      summonSounds:
        collection: gib # Placeholder
      retractSounds:
        collection: gib # Placeholder
    #Starlight edit: changeling action costs
    - type: ChangelingAction
      chemicalCost: 20 # Starlight, it takes energy to recall too... come on.
      requireAbsorbed: 1
