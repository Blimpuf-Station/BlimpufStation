- type: entity
  id: PartNeocyte
  parent: [BaseItem, BasePart]
  name: neocyte body part # Starlight, quotation marks removed
  abstract: true
  components:
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: BatteryAcid # Starlight, juicy
        Quantity: 5 # Starlight
      - ReagentId: Blood
        Quantity: 10

- type: entity
  id: TorsoNeocyte
  name: neocyte torso # Starlight, quotation marks removed
  parent: [PartNeocyte, BaseTorso]
  components:
  - type: Sprite
    sprite: _FarHorizons/Mobs/Species/Protogen/parts.rsi
    state: "torso_m"
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 10
      - ReagentId: BatteryAcid # Starlight, juicy
        Quantity: 15 # Starlight
      - ReagentId: Blood
        Quantity: 20

- type: entity
  id: HeadNeocyte
  name: neocyte head # Starlight, quotation marks removed
  parent: [PartNeocyte, BaseHead]
  components:
  - type: Sprite
    sprite: _FarHorizons/Mobs/Species/Protogen/parts.rsi
    state: "head_m"
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 5
      - ReagentId: BatteryAcid # Starlight, juicy
        Quantity: 5 # Starlight
      - ReagentId: Blood
        Quantity: 10

