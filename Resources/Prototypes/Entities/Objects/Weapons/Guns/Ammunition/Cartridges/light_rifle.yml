- type: entity
  abstract: true
  parent: [ BaseCartridge, BaseSecurityContraband, BaseContrabandTier3 ] # Blimpuf
  id: BaseCartridgeLightRifleSP
  name: cartridge (.30 rifle SP)
  description: A classic intermediate cartridge used by many combat rifles and LMGs. Soft-point, standard kinetic projectile, mostly used by law enforcements in engaging low-level threats. #Blimpuf
  components:
  - type: Tag
    tags:
    - CartridgeLightRifle
  - type: CartridgeAmmo
    proto: BulletLightRifleTraceSP
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/ammo_casing.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals

- type: entity
  parent: BaseCartridgeLightRifleSP
  id: CartridgeLightRifleSP
  name: cartridge (.30 rifle SP)
  components:
  - type: CartridgeAmmo
    proto: BulletLightRifleTraceSP
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#3F47DB"

- type: entity
  parent: [BaseContrabandTier1, BaseCartridgeLightRifleSP] # Blimpuf Practice is Tier 1
  id: CartridgeLightRiflePractice
  name: cartridge (.30 rifle practice)
  description: A classic intermediate cartridge used by many combat rifles and LMGs.Practice ammunition fires a chalk projectile that stings a little, but otherwise causes no lasting damage. #Blimpuf
  components:
  - type: CartridgeAmmo
    proto: BulletLightRifleTracePractice
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#D86E2C"

- type: entity
  parent: BaseCartridgeLightRifleSP
  id: CartridgeLightRifleIncendiary
  name: cartridge (.30 rifle incendiary)
  description: A rimless cartridge competing with the .20, often used by bolt-action rifles, DMRs and LMGs. Incendiary ammunition contains a self-igniting compound that sets targets ablaze. #Blimpuf
  components:
  - type: CartridgeAmmo
    proto: BulletLightRifleTraceIncendiary
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#BFC8CA"

- type: entity
  parent: BaseCartridgeLightRifleSP
  id: CartridgeLightRifleUranium
  name: cartridge (.30 rifle uranium)
  description: A rimless cartridge competing with the .20, often used by bolt-action rifles, DMRs and LMGs. Uranium ammunition replaces the lead core of the bullet with fissile material, irradiating targets from the inside. #Blimpuf
  components:
  - type: CartridgeAmmo
    proto: BulletLightRifleTraceUranium
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#65fe08"
