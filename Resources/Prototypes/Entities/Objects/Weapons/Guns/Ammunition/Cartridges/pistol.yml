- type: entity
  abstract: true
  parent: [ BaseCartridge, BaseSecurityContraband, BaseContrabandTier3 ] # Blimpuf
  id: BaseCartridgePistol
  name: cartridge (.35 auto)
  components:
  - type: Tag
    tags:
      - CartridgePistol
  - type: CartridgeAmmo
    proto: BulletPistolTraceSP
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/ammo_casing.rsi
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
  - type: Appearance
  - type: SpentAmmoVisuals

- type: entity
  parent: [BaseCartridgePistol, BaseSalvageContraband] # Blimpuf
  id: CartridgePistolSP
  name: cartridge (.35 auto SP)
  description: A medium-power pistol and submachine gun cartridge, widely-considered the standard in most parts of the sector. Soft-point, standard kinetic projectile, the soft lead tip expands slightly on impact to increase damage, at a slight cost to armor penetration. #Blimpuf
  components:
  - type: CartridgeAmmo
    proto: BulletPistolTraceSP
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#3F47DB"

- type: entity
  parent: [BaseContrabandTier1, BaseCartridgePistol] # Blimpuf Practice is Tier 1
  id: CartridgePistolPractice
  name: cartridge (.35 auto practice)
  description: A medium-power pistol and submachine gun cartridge, widely-considered the standard in most parts of the sector. Practice ammunition fires a chalk projectile that stings a little, but otherwise causes no lasting damage. #Blimpuf
  components:
  - type: CartridgeAmmo
    proto: BulletPistolTracePractice
  -  type: Sprite
     layers:
       - state: base
         map: [ "enum.AmmoVisualLayers.Base" ]
       - state: tip
         map: [ "enum.AmmoVisualLayers.Tip" ]
         color: "#D86E2C"

- type: entity
  parent: BaseCartridgePistol
  id: CartridgePistolIncendiary
  name: cartridge (.35 auto incendiary)
  description: A medium-power pistol and submachine gun cartridge, widely-considered the standard in most parts of the sector. Incendiary ammunition contains a self-igniting compound that sets targets ablaze. #Blimpuf
  components:
  - type: CartridgeAmmo
    proto: BulletPistolTraceIncendiary
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#BFC8CA"

- type: entity
  id: CartridgePistolUranium
  name: cartridge (.35 auto uranium)
  description: A medium-power pistol and submachine gun cartridge, widely-considered the standard in most parts of the sector. Uranium ammunition replaces the lead core of the bullet with fissile material, irradiating targets from the inside. #Blimpuf
  parent: BaseCartridgePistol
  components:
  - type: CartridgeAmmo
    proto: BulletPistolTraceUranium
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#65fe08"

- type: entity
  parent: BaseCartridgePistol
  id: CartridgePistolSpent
  name: cartridge (.35 auto)
  suffix: spent
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/ammo_casing.rsi
    layers:
    - state: base-spent
      map: [ "enum.AmmoVisualLayers.Base" ]
  - type: SpentAmmoVisuals
  - type: CartridgeAmmo
    proto: BulletPistol
    spent: true
  - type: Tag
    tags:
    - CartridgePistol
    - Trash # surely theres a way to automatically add this...
