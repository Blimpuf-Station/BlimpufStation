- type: entity
  parent: BaseCartridgeRifle
  id: CartridgeRifleUranium
  name: cartridge (.20 rifle uranium)
  description: Rimless centerfire intermediate power cartridge, the most common after the .35, often used in semi-automatic and automatic rifles. Uranium ammunition replaces the lead core of the bullet with fissile material, irradiating targets from the inside. #Blimpuf
  components:
  - type: CartridgeAmmo
    proto: BulletRifleTraceUranium
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
