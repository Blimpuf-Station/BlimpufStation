- type: entity
  abstract: true
  parent: [ BaseCartridge, BaseSecurityContraband, BaseContrabandTier3 ] # Blimpuf
  id: BaseCartridgeRifle
  name: cartridge (.20 rifle)
  components:
  - type: Tag
    tags:
      - CartridgeRifle
  - type: CartridgeAmmo
    proto: BulletRifleTrace
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/ammo_casing.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals

- type: entity
  parent: BaseCartridgeRifle
  id: CartridgeRifleSP
  name: cartridge (.20 rifle SP)
  description: Rimless centerfire intermediate power cartridge, the most common after the .35, often used in semi-automatic and automatic rifles. Soft-point, standard kinetic cartridge, mostly used by law enforcements in engaging low-level threats. #Blimpuf
  components:
  - type: CartridgeAmmo
    proto: BulletRifleTraceSP
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#3F47DB"

- type: entity
  parent: [BaseContrabandTier1, BaseCartridgeRifle] # Blimpuf Practice is Tier 1
  id: CartridgeRiflePractice
  name: cartridge (.20 rifle practice)
  description: ARimless centerfire intermediate power cartridge, the most common after the .35, often used in semi-automatic and automatic rifles. Practice ammunition fires a chalk projectile that stings a little, but otherwise causes no lasting damage. #Blimpuf
  components:
  - type: CartridgeAmmo
    proto: BulletRifleTracePractice
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#D86E2C"

- type: entity
  parent: BaseCartridgeRifle
  id: CartridgeRifleIncendiary
  name: cartridge (.20 rifle incendiary)
  description: Rimless centerfire intermediate power cartridge, the most common after the .35, often used in semi-automatic and automatic rifles. Incendiary ammunition contains a self-igniting compound that sets targets ablaze. #Blimpuf
  components:
  - type: CartridgeAmmo
