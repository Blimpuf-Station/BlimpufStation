- type: entity
  name: yellow slime
  parent: MobAdultSlimesYellow
  id: MobAdultSlimesYellowAngry
  suffix: Angry
  components:
    - type: NpcFactionMember
      factions:
        - SimpleHostile
    - type: GhostRole
      description: ghost-role-information-angry-slimes-description
      rules: ghost-role-information-angry-slimes-rules
      mindRoles:
      - MindRoleGhostRoleTeamAntagonist
      raffle:
        settings: short

# Blimpuf - Start
- type: entity
  name: geras
  description: A geras of a slime - the name is ironic, isn't it?
  parent: BaseMobAdultSlimes
  id: MobSlimesGeras
  components:
    # Work around till we find out why geras dont inherit the parent components
    - type: Vocal
      sounds:
        Unsexed: SlimeCoreSounds
    - type: Speech
      speechVerb: Slime
      speechSounds: Slime
      allowedEmotes: [ 'Squish', 'Bubble', 'Slosh', 'Pop', 'Fizz', 'Wobble' ]
      restrictVocalEmotesToAllowed: true
    # End of workaround
    # they portable...
    - type: GerasBall
    - type: HTN
      rootTask:
        task: SimpleHostileCompound
    - type: MultiHandedItem
    - type: Item
      size: Huge
    - type: Sprite
      sprite: Mobs/Aliens/slimes.rsi
      layers:
        - map: [ "enum.DamageStateVisualLayers.Base" ]
          state: gray_adult_slime
    - type: GerasColor
    - type: Bloodstream
      bloodReagentColor: "#999999"
    - type: MeleeWeapon
      attackRate: 2
      damage:
        types:
          Blunt: 4
    - type: DamageStateVisuals
      states:
        Alive:
          Base: gray_adult_slime
        Dead:
          Base: gray_adult_slime_dead
    - type: UserInterface
      interfaces:
        enum.StorageUiKey.Key:
          type: StorageBoundUserInterface
    - type: Storage
      clickInsert: false
      # Starlight-start
      showVerb: false
      openOnActivate: false
      # Starlight-end
      grid:
        - 0,0,1,2
      maxItemSize: Large
      storageInsertSound:
        path: /Audio/Voice/Slime/slime_squish.ogg
    - type: PrivateStorage
      accessDelay: 3.0
      accessPopup: "laspi-storage-accessing"
      # Starlight Edit - End
    - type: ContainerContainer
      containers:
        storagebase: !type:Container
          ents: [ ]
    - type: Hands
# Blimpuf - End
